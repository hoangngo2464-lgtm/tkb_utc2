<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Thời Khoá Biểu Sinh Viên – UTC2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#F0F4FF;--surface:#FFFFFF;--primary:#3B82F6;--primary-l:#DBEAFE;
      --accent:#FF7043;--accent-l:#FFF0EB;--text:#1E293B;--muted:#64748B;
      --border:#E2E8F0;--shadow:0 4px 24px rgba(59,130,246,.08);
      --r:16px;--tiet-h:52px;--max-tiet:15;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:140px}

    /* ═══ HEADER ═══ */
    .header{
      position:sticky;top:0;z-index:30;
      background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);padding:12px 20px;
      display:flex;align-items:center;gap:12px;
    }
    .h-logo{
      width:38px;height:38px;border-radius:11px;flex-shrink:0;
      background:linear-gradient(135deg,var(--primary),#60A5FA);
      display:flex;align-items:center;justify-content:center;font-size:18px;
    }
    .h-title{font-size:17px;font-weight:800;color:var(--primary);line-height:1.2}
    .h-sub{font-size:10px;color:var(--muted);font-weight:400}
    .h-sem{
      margin-left:auto;background:var(--primary-l);color:var(--primary);
      font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;white-space:nowrap;
    }

    /* ═══ MAIN ═══ */
    .main{max-width:960px;margin:0 auto;padding:20px 16px 40px}

    .page-title{text-align:center;margin-bottom:20px}
    .page-title h1{font-size:26px;font-weight:800;color:var(--text)}
    .page-title p{font-size:13px;color:var(--muted);margin-top:4px}

    /* ═══ SEARCH ═══ */
    .search-box{
      background:var(--surface);border-radius:var(--r);padding:6px;
      box-shadow:var(--shadow);display:flex;gap:6px;margin-bottom:16px;
      border:1.5px solid var(--border);transition:border-color .2s;
    }
    .search-box:focus-within{border-color:var(--primary)}
    .search-box input{
      flex:1;border:none;outline:none;font-family:inherit;font-size:15px;
      color:var(--text);padding:10px 14px;background:transparent;min-width:0;
    }
    .search-box input::placeholder{color:#94A3B8}
    .s-btn{
      background:linear-gradient(135deg,var(--primary),#60A5FA);color:#fff;
      border:none;border-radius:12px;padding:10px 20px;font-family:inherit;
      font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;
      white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0;
    }
    .s-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.3)}
    .s-btn:disabled{opacity:.6;cursor:not-allowed}

    /* ═══ ERROR ═══ */
    .err{
      background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;
      padding:12px 16px;color:#DC2626;font-size:13px;margin-bottom:14px;
      display:none;align-items:center;gap:8px;
    }
    .err.show{display:flex}

    /* ═══ STUDENT CARD ═══ */
    .stu-card{
      background:linear-gradient(135deg,var(--primary),#60A5FA);
      border-radius:var(--r);padding:16px 20px;color:#fff;
      margin-bottom:16px;display:none;align-items:center;gap:14px;
      box-shadow:0 8px 28px rgba(59,130,246,.2);
    }
    .stu-card.show{display:flex}
    .stu-av{
      width:46px;height:46px;border-radius:50%;flex-shrink:0;
      background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;
    }
    .stu-name{font-size:16px;font-weight:700}
    .stu-id{font-size:12px;opacity:.8;margin-top:2px}
    .stu-cnt{
      margin-left:auto;background:rgba(255,255,255,.18);border-radius:10px;
      padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;
    }

    /* ═══ CALENDAR ═══ */
    .cal-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}

    .wk-nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;border-bottom:1.5px solid var(--border);
    }
    .wk-btn{
      background:#F1F5F9;border:1px solid var(--border);border-radius:8px;
      width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--muted);
      transition:all .15s;display:flex;align-items:center;justify-content:center;
    }
    .wk-btn:hover{background:var(--primary-l);color:var(--primary);border-color:var(--primary)}
    .wk-center{display:flex;align-items:center;gap:8px}
    .wk-range{font-size:14px;font-weight:700;color:var(--text)}
    .wk-today{
      font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-l);
      border:1px solid #BFDBFE;border-radius:6px;padding:4px 10px;cursor:pointer;
      transition:all .15s;
    }
    .wk-today:hover{background:var(--primary);color:#fff}

    .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .cal-grid{min-width:620px;position:relative}

    .cal-head{display:grid;grid-template-columns:48px repeat(6,1fr);border-bottom:2px solid var(--border)}
    .hd-corner{
      background:#F8FAFC;border-right:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:10px;color:var(--muted);font-weight:700;padding:10px 4px;
    }
    .hd-day{padding:10px 4px;text-align:center;border-right:1px solid var(--border)}
    .hd-day:last-child{border-right:none}
    .hd-day.today{background:linear-gradient(135deg,var(--primary),#60A5FA)}
    .hd-day.today .dn,.hd-day.today .dd{color:#fff!important}
    .dn{font-size:12px;font-weight:700;color:var(--text)}
    .dd{font-size:10px;color:var(--muted);margin-top:1px}

    .cal-body{display:grid;grid-template-columns:48px repeat(6,1fr);position:relative}
    .tiet-col{border-right:1px solid var(--border)}
    .tiet-num{
      height:var(--tiet-h);display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:600;color:#94A3B8;border-bottom:1px solid #F1F5F9;
    }
    .day-col{position:relative;border-right:1px solid var(--border)}
    .day-col:last-child{border-right:none}
    .day-col-bg{position:absolute;inset:0;pointer-events:none}
    .bg-row{height:var(--tiet-h);border-bottom:1px dashed #EDF2F8}

    /* Subject card */
    .sub-card{
      position:absolute;left:3px;right:3px;border-radius:10px;
      padding:6px 8px;cursor:pointer;overflow:hidden;z-index:1;
      transition:transform .15s,box-shadow .15s;
    }
    .sub-card:hover{transform:scale(1.03);z-index:5;filter:brightness(1.08)}
    .sub-card:active{transform:scale(.98)}
    .sc-tiet{font-size:9px;font-weight:600;color:rgba(255,255,255,.85)}
    .sc-name{
      font-size:11px;font-weight:700;color:#fff;margin-top:2px;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .sc-room{font-size:9.5px;color:rgba(255,255,255,.9);margin-top:2px;display:flex;align-items:center;gap:2px}
    .sc-icon{position:absolute;bottom:4px;right:6px;font-size:16px;opacity:.2}

    /* Empty overlay */
    .empty-ov{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(255,255,255,.9);pointer-events:none;
      text-align:center;padding:30px;z-index:10;
    }
    .empty-ov .ei{font-size:48px;margin-bottom:10px}
    .empty-ov .et{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
    .empty-ov .es{font-size:12px;color:var(--muted)}

    /* ═══ CAT ═══ */
    .cat-wrap{
      position:fixed;bottom:16px;right:16px;z-index:50;
      display:flex;flex-direction:column;align-items:flex-end;gap:8px;
      pointer-events:none;
    }
    .cat-speech{
      background:var(--surface);border:2px solid var(--accent);
      border-radius:16px 16px 4px 16px;padding:10px 14px;
      font-size:12px;font-weight:600;color:var(--text);
      box-shadow:0 4px 20px rgba(255,112,67,.15);
      max-width:200px;line-height:1.5;text-align:center;
      opacity:0;transform:translateY(8px) scale(.9);
      transition:all .4s cubic-bezier(.34,1.56,.64,1);
      pointer-events:none;
    }
    .cat-speech.show{opacity:1;transform:translateY(0) scale(1)}
    .cat-speech::after{
      content:'';position:absolute;bottom:-8px;right:28px;
      border-left:8px solid transparent;border-right:8px solid transparent;
      border-top:8px solid var(--surface);
    }
    .cat-speech::before{
      content:'';position:absolute;bottom:-10px;right:27px;
      border-left:9px solid transparent;border-right:9px solid transparent;
      border-top:9px solid var(--accent);
    }

    .cat-svg{width:90px;height:100px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.12))}

    /* Cat animations */
    .cat-tail{transform-origin:22px 72px;animation:tailWag 1.8s ease-in-out infinite}
    @keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}

    .cat-blink-l,.cat-blink-r{animation:blink 3.5s ease infinite}
    .cat-blink-r{animation-delay:.1s}
    @keyframes blink{0%,92%,100%{ry:0}96%{ry:6}}

    .cat-paw-r{transform-origin:62px 88px;transition:transform .3s}
    .cat-wrap.guide .cat-paw-r{animation:pawWave 1.2s ease-in-out infinite}
    @keyframes pawWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg) translateY(-4px)}}

    .cat-wrap.happy .cat-svg{animation:catBounce .6s ease}
    @keyframes catBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}

    .cat-wrap.walk{animation:catWalk 1s ease forwards}
    @keyframes catWalk{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}

    /* Cat eye follow */
    .cat-pupil-l,.cat-pupil-r{transition:cx .3s,cy .3s}

    /* ═══ MODAL ═══ */
    .m-overlay{
      position:fixed;inset:0;background:rgba(15,23,42,.45);
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      display:flex;align-items:flex-end;justify-content:center;
      z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
    }
    .m-overlay.open{opacity:1;pointer-events:all}
    .modal{
      background:var(--surface);border-radius:24px 24px 0 0;padding:0;
      max-width:440px;width:100%;max-height:85vh;overflow-y:auto;
      box-shadow:0 -8px 40px rgba(0,0,0,.15);
      transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
    }
    .m-overlay.open .modal{transform:translateY(0)}

    .m-color-bar{height:6px;border-radius:24px 24px 0 0}
    .m-content{padding:24px 24px 28px}
    .m-drag{
      width:36px;height:4px;border-radius:4px;background:#E2E8F0;
      margin:0 auto 16px;
    }
    .m-title{font-size:18px;font-weight:800;color:var(--text);line-height:1.4;margin-bottom:20px}

    .m-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
    .m-ico{
      width:36px;height:36px;border-radius:10px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:16px;
    }
    .m-lbl{font-size:11px;color:var(--muted);font-weight:500}
    .m-val{font-size:14px;color:var(--text);font-weight:600;margin-top:2px;line-height:1.4}

    .m-close{
      margin-top:20px;width:100%;background:linear-gradient(135deg,var(--primary),#60A5FA);
      color:#fff;border:none;border-radius:14px;padding:14px;
      font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
      transition:all .15s;
    }
    .m-close:hover{opacity:.9;transform:translateY(-1px)}
    .m-close:active{transform:scale(.98)}

    /* ═══ RESPONSIVE ═══ */
    @media(min-width:768px){
      .main{padding:28px 24px 40px}
      .page-title h1{font-size:30px}
      .m-overlay{align-items:center}
      .modal{border-radius:24px;max-height:80vh}
      .m-drag{display:none}
      .cat-svg{width:110px;height:120px}
      .cat-speech{max-width:240px;font-size:13px}
    }
    @media(max-width:480px){
      .header{padding:10px 14px}
      .h-sem{display:none}
      .main{padding:14px 10px 30px}
      .page-title h1{font-size:22px}
      .search-box{flex-direction:column}
      .s-btn{justify-content:center}
      .cat-svg{width:70px;height:80px}
      .cat-wrap{bottom:10px;right:10px}
      .cat-speech{font-size:11px;max-width:160px;padding:8px 10px}
    }

    /* ═══ SCROLLBAR ═══ */
    .cal-scroll::-webkit-scrollbar{height:6px}
    .cal-scroll::-webkit-scrollbar-track{background:#F1F5F9;border-radius:3px}
    .cal-scroll::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
    .cal-scroll::-webkit-scrollbar-thumb:hover{background:#94A3B8}

    /* ═══ MISC ═══ */
    .fade-in{animation:fadeIn .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
  <div class="h-logo">🎓</div>
  <div>
    <div class="h-title">UTC2</div>
    <div class="h-sub">Thời khoá biểu sinh viên</div>
  </div>
  <div class="h-sem">📅 HK1 2026–2027</div>
</header>

<!-- ═══ MAIN ═══ -->
<main class="main">
  <div class="page-title">
    <h1>📋 Thời khoá biểu</h1>
    <p>Học tập hôm nay – Thành công ngày mai</p>
  </div>

  <div class="err" id="errBar"><span>⚠️</span><span id="errTxt"></span></div>

  <div class="stu-card" id="stuCard">
    <div class="stu-av">🧑‍🎓</div>
    <div>
      <div class="stu-name" id="stuName">—</div>
      <div class="stu-id" id="stuId">—</div>
    </div>
    <div class="stu-cnt" id="stuCnt">—</div>
  </div>

  <div class="search-box">
    <input id="mssvIn" type="text" placeholder="Nhập MSSV của bạn..." maxlength="20" autocomplete="off"/>
    <button class="s-btn" id="srchBtn" onclick="doSearch()">🔍 Xem TKB</button>
  </div>

  <div class="cal-card">
    <div class="wk-nav">
      <button class="wk-btn" onclick="shiftWeek(-1)">‹</button>
      <div class="wk-center">
        <span class="wk-range" id="wkRange">—</span>
        <button class="wk-today" onclick="goToday()">Hôm nay</button>
      </div>
      <button class="wk-btn" onclick="shiftWeek(1)">›</button>
    </div>
    <div class="cal-scroll">
      <div class="cal-grid">
        <div class="cal-head" id="calHead"></div>
        <div class="cal-body" id="calBody"></div>
      </div>
    </div>
  </div>
</main>

<!-- ═══ CAT ═══ -->
<div class="cat-wrap walk" id="catWrap">
  <div class="cat-speech" id="catSpeech">Nhập MSSV để xem thời khoá biểu nhé! 🐱</div>
  <svg class="cat-svg" viewBox="0 0 100 100">
    <!-- Tail -->
    <path class="cat-tail" d="M22,72 C8,62 4,46 16,40 C20,38 24,42 20,48" fill="none" stroke="#FF8A58" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="52" cy="72" rx="28" ry="20" fill="#FF8A58"/>
    <ellipse cx="52" cy="76" rx="16" ry="12" fill="#FFDAB9"/>
    <!-- Paws -->
    <ellipse cx="38" cy="88" rx="8" ry="5" fill="#FF8A58"/>
    <g class="cat-paw-r"><ellipse cx="66" cy="88" rx="8" ry="5" fill="#FF8A58"/></g>
    <!-- Head -->
    <circle cx="52" cy="40" r="24" fill="#FF8A58"/>
    <!-- Ears -->
    <polygon points="33,28 26,4 46,22" fill="#FF8A58"/>
    <polygon points="35,25 30,10 44,22" fill="#FFAB91"/>
    <polygon points="71,28 78,4 58,22" fill="#FF8A58"/>
    <polygon points="69,25 74,10 60,22" fill="#FFAB91"/>
    <!-- Eyes -->
    <ellipse cx="43" cy="38" rx="6" ry="6.5" fill="white"/>
    <ellipse cx="61" cy="38" rx="6" ry="6.5" fill="white"/>
    <circle class="cat-pupil-l" cx="44" cy="39" r="3.8" fill="#2D1B0E"/>
    <circle class="cat-pupil-r" cx="62" cy="39" r="3.8" fill="#2D1B0E"/>
    <circle cx="46" cy="37" r="1.5" fill="white"/>
    <circle cx="64" cy="37" r="1.5" fill="white"/>
    <!-- Blink lids -->
    <ellipse class="cat-blink-l" cx="43" cy="38" rx="6.5" ry="0" fill="#FF8A58"/>
    <ellipse class="cat-blink-r" cx="61" cy="38" rx="6.5" ry="0" fill="#FF8A58"/>
    <!-- Nose -->
    <ellipse cx="52" cy="47" rx="2.5" ry="2" fill="#FFAB91"/>
    <!-- Mouth -->
    <path d="M50,49 Q52,52 54,49" fill="none" stroke="#6D4C41" stroke-width="1" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="27" y1="43" x2="40" y2="45" stroke="#6D4C41" stroke-width=".8" stroke-linecap="round"/>
    <line x1="26" y1="48" x2="39" y2="48" stroke="#6D4C41" stroke-width=".8" stroke-linecap="round"/>
    <line x1="64" y1="45" x2="77" y2="43" stroke="#6D4C41" stroke-width=".8" stroke-linecap="round"/>
    <line x1="65" y1="48" x2="78" y2="48" stroke="#6D4C41" stroke-width=".8" stroke-linecap="round"/>
    <!-- Collar -->
    <path d="M35,60 Q52,67 69,60" fill="none" stroke="#42A5F5" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="52" cy="64" r="3" fill="#FFD54F"/>
    <circle cx="52" cy="64" r="1.5" fill="#FFC107"/>
  </svg>
</div>

<!-- ═══ MODAL ═══ -->
<div class="m-overlay" id="mOverlay">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="m-color-bar" id="mBar"></div>
    <div class="m-content">
      <div class="m-drag"></div>
      <div class="m-title" id="mTitle"></div>
      <div class="m-row">
        <div class="m-ico" style="background:#EFF6FF">🆔</div>
        <div><div class="m-lbl">Mã học phần</div><div class="m-val" id="mCode"></div></div>
      </div>
      <div class="m-row">
        <div class="m-ico" style="background:#F0FDF4">👨‍🏫</div>
        <div><div class="m-lbl">Giảng viên</div><div class="m-val" id="mGv"></div></div>
      </div>
      <div class="m-row">
        <div class="m-ico" style="background:#FFF7ED">🗓️</div>
        <div><div class="m-lbl">Thời gian học</div><div class="m-val" id="mTime"></div></div>
      </div>
      <div class="m-row">
        <div class="m-ico" style="background:#FDF2F8">📅</div>
        <div><div class="m-lbl">Học kỳ (Bắt đầu – Kết thúc)</div><div class="m-val" id="mSem"></div></div>
      </div>
      <div class="m-row">
        <div class="m-ico" style="background:#ECFDF5">📍</div>
        <div><div class="m-lbl">Phòng học</div><div class="m-val" id="mRoom"></div></div>
      </div>
      <button class="m-close" onclick="closeModal()">Đóng</button>
    </div>
  </div>
</div>

<script>
/* ═══ STATE ═══ */
let weekStart = monday(new Date());
let subjects  = [];
const DAY_L = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const TIET_H = 52, MAX_TIET = 15;
const COLORS = ['#3B82F6','#10B981','#EC4899','#F59E0B','#8B5CF6','#14B8A6','#EF4444','#6366F1','#F97316','#06B6D4'];
const ICONS  = ['💻','⚡','🔬','📐','🧮','📡','🏗️','🔧','🎯','🧪','📚','🎨'];

/* ═══ INIT ═══ */
(function(){
  renderHead(); renderBody([]);
  document.getElementById('mssvIn').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
  const h=location.hash.replace('#','').trim();
  if(h){document.getElementById('mssvIn').value=h;doSearch()}
  // Show initial cat speech
  setTimeout(()=>showCatSpeech('Nhập MSSV để xem thời khoá biểu nhé! 🐱'),800);
})();

/* ═══ DATE HELPERS ═══ */
function monday(d){const c=new Date(d);c.setHours(0,0,0,0);const dow=c.getDay()||7;c.setDate(c.getDate()-(dow-1));return c}
function add(d,n){const c=new Date(d);c.setDate(c.getDate()+n);return c}
function fmt(d){return`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`}
function fmtS(d){return`${p(d.getDate())}/${p(d.getMonth()+1)}`}
function p(n){return String(n).padStart(2,'0')}
function sameDay(a,b){return a.toDateString()===b.toDateString()}
function parseDS(s){if(!s)return null;const pt=s.split('/');if(pt.length!==3)return null;return new Date(+pt[2],+pt[1]-1,+pt[0])}
function inWeek(sub,ws){
  const s=parseDS(sub.NGAY_BD_TG),e=parseDS(sub.NGAY_KT_TG);
  if(!s||!e)return true;
  const we=add(ws,6);we.setHours(23,59,59,999);
  return s<=we&&e>=ws;
}

/* ═══ WEEK NAV ═══ */
function shiftWeek(d){weekStart=add(weekStart,d*7);renderHead();renderBody(subjects)}
function goToday(){weekStart=monday(new Date());renderHead();renderBody(subjects)}

function renderHead(){
  const end=add(weekStart,5),today=new Date();today.setHours(0,0,0,0);
  document.getElementById('wkRange').textContent=`${fmtS(weekStart)} – ${fmtS(end)}/${weekStart.getFullYear()}`;
  const hd=document.getElementById('calHead');hd.innerHTML='';
  hd.appendChild(el('div','hd-corner','Tiết'));
  for(let d=0;d<6;d++){
    const date=add(weekStart,d),isNow=sameDay(date,today);
    const c=el('div',`hd-day${isNow?' today':''}`);
    c.innerHTML=`<div class="dn">${DAY_L[d]}</div><div class="dd">${fmtS(date)}</div>`;
    hd.appendChild(c);
  }
}

/* ═══ PARSE TKB ═══ */
function parseTkb(s){
  if(!s)return[];const r=[],re=/(Thứ [2-7]|Chủ nhật): tiết (\d+) -> (\d+)/g;
  let m,hits=[];
  while((m=re.exec(s))!==null)hits.push({idx:m.index,end:m.index+m[0].length,day:m[1],s:+m[2],e:+m[3]});
  hits.forEach((h,i)=>{
    const nxt=i+1<hits.length?hits[i+1].idx:s.length,after=s.slice(h.end,nxt);
    const rm=after.match(/^\s*\|\s*(.+?)(?:\s*\|.*)?$/);
    r.push({day:h.day,startTiet:h.s,endTiet:h.e,room:rm?rm[1].trim():''});
  });
  return r;
}
function dayIdx(l){return DAY_L.indexOf(l)}

/* ═══ RENDER BODY ═══ */
function renderBody(subs){
  const body=document.getElementById('calBody');body.innerHTML='';
  const co={},io={};
  subs.forEach((s,i)=>{const k=s.MA_LOP||s.TEN_MON;co[k]=COLORS[i%COLORS.length];io[k]=ICONS[i%ICONS.length]});

  const tc=el('div','tiet-col');
  for(let t=1;t<=MAX_TIET;t++)tc.appendChild(el('div','tiet-num',String(t)));
  body.appendChild(tc);

  let cnt=0;
  for(let d=0;d<6;d++){
    const dc=el('div','day-col');dc.style.height=`${MAX_TIET*TIET_H}px`;
    const bg=el('div','day-col-bg');
    for(let t=0;t<MAX_TIET;t++)bg.appendChild(el('div','bg-row'));
    dc.appendChild(bg);

    subs.forEach(sub=>{
      if(!inWeek(sub,weekStart))return;
      const k=sub.MA_LOP||sub.TEN_MON,color=co[k]||COLORS[0],icon=io[k]||'📚';
      parseTkb(sub.TKB||sub.LICH_HOC||'').forEach(sc=>{
        if(dayIdx(sc.day)!==d||sc.startTiet<1||sc.endTiet>MAX_TIET)return;
        cnt++;
        const top=(sc.startTiet-1)*TIET_H+2,h=(sc.endTiet-sc.startTiet+1)*TIET_H-4;
        const sn=(sub.TEN_MON||sub.MA_LOP||'').replace(/(-\d+-\d+.*)$/,'').trim();
        const rs=sc.room?sc.room.split(' ')[0]:'';
        const card=el('div','sub-card');
        card.style.cssText=`top:${top}px;height:${h}px;background:${color};box-shadow:0 2px 8px ${color}44`;
        card.innerHTML=`<div class="sc-tiet">Tiết ${sc.startTiet}–${sc.endTiet}</div><div class="sc-name">${sn||sub.MA_LOP||'?'}</div>${rs?`<div class="sc-room">📍 ${rs}</div>`:''}<div class="sc-icon">${icon}</div>`;
        card.addEventListener('click',()=>openModal(sub,sc,color));
        dc.appendChild(card);
      });
    });
    body.appendChild(dc);
  }

  if(subs.length>0){const c=document.getElementById('stuCnt');if(c)c.textContent=`Tuần này: ${cnt} tiết`}
  if(subs.length===0){
    const ov=el('div','empty-ov fade-in');
    ov.innerHTML=`<div class="ei">📅</div><div class="et">Nhập MSSV để xem thời khoá biểu</div><div class="es">Dùng ô tìm kiếm phía trên</div>`;
    body.appendChild(ov);
  }else if(cnt===0){
    const ov=el('div','empty-ov fade-in');
    ov.style.background='transparent';
    ov.innerHTML=`<div class="ei">🏖️</div><div class="et">Tuần này trống lịch</div><div class="es">Không có môn nào trong tuần này!</div>`;
    body.appendChild(ov);
    showCatSpeech('Tuần này được nghỉ rồi! Nghỉ ngơi đi 😴');
  }
}

/* ═══ SEARCH ═══ */
async function doSearch(){
  const mssv=document.getElementById('mssvIn').value.trim().toUpperCase();
  if(!mssv){showErr('Vui lòng nhập Mã số sinh viên!');return}
  hideErr();setL(true);document.getElementById('stuCard').classList.remove('show');
  location.hash=mssv;
  showCatSpeech('Đang tìm kiếm... 🔍');
  try{
    const res=await fetch(`/api/tkb/${encodeURIComponent(mssv)}`);
    const json=await res.json();
    if(!json.ok)throw new Error(json.error||'API lỗi');
    if(!json.data?.length){
      showErr(`Không tìm thấy TKB cho MSSV: ${mssv}`);
      subjects=[];renderBody([]);
      showCatSpeech('Không tìm thấy... Thử lại nhé! 😿');
      return;
    }
    subjects=json.data;
    const name=json.data[0]?.HO_TEN||'Sinh viên UTC2';
    document.getElementById('stuName').textContent=name;
    document.getElementById('stuId').textContent=`MSSV: ${mssv}`;
    document.getElementById('stuCard').classList.add('show');

    if(subjects.length>0&&subjects[0].NGAY_BD_TG){
      const fd=parseDS(subjects[0].NGAY_BD_TG);
      if(fd)weekStart=monday(fd);
    }
    renderHead();renderBody(subjects);
    showCatSpeech('Nhấn vào môn học để xem chi tiết nhé! 🐾');
    triggerCatGuide();
  }catch(e){
    showErr('Lỗi kết nối: '+e.message);subjects=[];renderBody([]);
    showCatSpeech('Có lỗi xảy ra... Thử lại nhé! 😿');
  }finally{setL(false)}
}

/* ═══ MODAL ═══ */
function openModal(sub,sc,color){
  document.getElementById('mBar').style.background=color;
  document.getElementById('mTitle').textContent=sub.TEN_MON||sub.MA_LOP;
  document.getElementById('mCode').textContent=sub.MA_LOP||'—';
  document.getElementById('mGv').textContent=sub.GIANG_VIEN||'—';
  document.getElementById('mTime').textContent=`${sc.day}: Tiết ${sc.startTiet} → ${sc.endTiet}${sc.room?' | '+sc.room:''}`;
  document.getElementById('mSem').textContent=`${sub.NGAY_BD_TG||'?'} → ${sub.NGAY_KT_TG||'?'}`;
  document.getElementById('mRoom').textContent=sc.room||'—';
  document.getElementById('mOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  // Cat happy
  const cw=document.getElementById('catWrap');
  cw.classList.add('happy');
  setTimeout(()=>cw.classList.remove('happy'),700);
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('mOverlay')&&e.type==='click')return;
  document.getElementById('mOverlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('mOverlay').addEventListener('click',closeModal);

/* ═══ CAT ═══ */
let speechTimer=null;
function showCatSpeech(msg){
  const sp=document.getElementById('catSpeech');
  sp.textContent=msg;sp.classList.add('show');
  clearTimeout(speechTimer);
  speechTimer=setTimeout(()=>sp.classList.remove('show'),5000);
}
function triggerCatGuide(){
  const cw=document.getElementById('catWrap');
  cw.classList.add('guide');
  setTimeout(()=>cw.classList.remove('guide'),6000);
}

/* ═══ UTILS ═══ */
function el(t,c='',txt=''){const e=document.createElement(t);if(c)e.className=c;if(txt)e.textContent=txt;return e}
function showErr(m){document.getElementById('errTxt').textContent=m;document.getElementById('errBar').classList.add('show')}
function hideErr(){document.getElementById('errBar').classList.remove('show')}
function setL(on){const b=document.getElementById('srchBtn');b.disabled=on;b.innerHTML=on?'⏳ Đang tải...':'🔍 Xem TKB'}
</script>
