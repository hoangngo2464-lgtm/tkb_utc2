<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thời Khoá Biểu Sinh Viên – UTC2</title>
  <meta name="description" content="Tra cứu thời khoá biểu sinh viên Trường Đại học Giao thông Vận tải TP.HCM – UTC2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ═══ TOKENS ═══ */
    :root {
      --sw: 230px;
      --th: 54px;
      --mt: 15;
      --blue:   #3B82F6;
      --blue2:  #60A5FA;
      --indigo: #6366F1;
      --bg:     #E8F4FD;
      --white:  #FFFFFF;
      --border: #DBEAFE;
      --text:   #1E293B;
      --muted:  #64748B;
      --shadow: 0 4px 24px rgba(59,130,246,.10);
      --r: 16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    /* ═══ LAYOUT ═══ */
    .app{display:flex;min-height:100vh}

    /* ═══ SIDEBAR ═══ */
    .sidebar{
      width:var(--sw);min-height:100vh;
      background:var(--white);
      box-shadow:2px 0 20px rgba(59,130,246,.07);
      display:flex;flex-direction:column;
      padding:22px 16px;gap:16px;
      position:fixed;top:0;left:0;bottom:0;
      overflow-y:auto;z-index:20;
    }
    .logo{display:flex;align-items:center;gap:10px;padding-bottom:6px}
    .logo-icon{
      width:42px;height:42px;border-radius:12px;flex-shrink:0;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      display:flex;align-items:center;justify-content:center;font-size:20px;
    }
    .logo h2{font-size:18px;font-weight:800;color:var(--blue)}
    .logo p{font-size:10px;color:var(--muted);margin-top:1px}

    .sb-student{
      background:#EFF6FF;border:1px solid #BFDBFE;border-radius:14px;
      padding:13px;display:flex;align-items:center;gap:10px;
    }
    .sb-avatar{
      width:42px;height:42px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      display:flex;align-items:center;justify-content:center;
      font-size:20px;color:white;
    }
    .sb-lbl{font-size:11px;color:var(--muted)}
    #sbName{display:block;font-size:13px;font-weight:700;color:var(--text);line-height:1.3;margin-top:2px}

    .sb-day{
      background:linear-gradient(145deg,var(--blue),var(--blue2));
      border-radius:16px;padding:18px 14px;color:white;text-align:center;
      position:relative;overflow:hidden;
    }
    .sb-day::before,.sb-day::after{
      content:'';position:absolute;border-radius:50%;
      background:rgba(255,255,255,.12);
    }
    .sb-day::before{width:80px;height:80px;top:-20px;right:-20px}
    .sb-day::after{width:80px;height:80px;bottom:-25px;left:-10px;background:rgba(255,255,255,.08)}
    .sb-day .lbl{font-size:11px;opacity:.85;position:relative;z-index:1}
    .sb-day .name{font-size:26px;font-weight:800;margin:4px 0;position:relative;z-index:1}
    .sb-day .date{font-size:13px;opacity:.9;position:relative;z-index:1}

    .sb-quote{
      background:linear-gradient(135deg,#FFF7ED,#FEF3C7);
      border:1px solid #FDE68A;border-radius:14px;padding:14px;margin-top:auto;
    }
    .sb-quote p{font-size:11.5px;color:#92400E;line-height:1.7;text-align:center;font-style:italic}

    /* ═══ MAIN ═══ */
    .main{margin-left:var(--sw);flex:1;padding:26px 26px 48px;min-width:0}

    .page-hdr{text-align:center;margin-bottom:22px}
    .page-hdr h1{
      font-size:32px;font-weight:800;color:var(--text);
      display:flex;align-items:center;justify-content:center;gap:10px;
    }
    .page-hdr .sub{font-size:14px;color:var(--muted);margin-top:6px}
    .sem-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--white);border:1.5px solid var(--border);border-radius:10px;
      padding:7px 16px;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px;
    }

    .err-bar{
      background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;
      padding:12px 18px;color:#DC2626;font-size:13.5px;
      margin-bottom:16px;display:none;align-items:center;gap:8px;
    }
    .err-bar.show{display:flex}

    .res-card{
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      border-radius:14px;padding:15px 20px;color:white;
      margin-bottom:18px;display:none;align-items:center;gap:14px;
      box-shadow:0 8px 24px rgba(59,130,246,.25);
    }
    .res-card.show{display:flex}
    .res-avt{
      width:48px;height:48px;border-radius:50%;flex-shrink:0;
      background:rgba(255,255,255,.22);
      display:flex;align-items:center;justify-content:center;font-size:24px;
    }
    .res-name{font-size:17px;font-weight:700}
    .res-mssv{font-size:12px;opacity:.85;margin-top:2px}
    .res-cnt{
      margin-left:auto;background:rgba(255,255,255,.2);
      border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;
    }

    .srch{
      background:var(--white);border-radius:14px;padding:14px 18px;
      box-shadow:var(--shadow);margin-bottom:22px;
      display:flex;align-items:center;gap:12px;
      border:1.5px solid var(--border);transition:border-color .2s;
    }
    .srch:focus-within{border-color:var(--blue)}
    .srch .ico{font-size:18px;color:var(--muted);flex-shrink:0}
    .srch input{
      flex:1;border:none;outline:none;font-family:inherit;
      font-size:15px;color:var(--text);background:transparent;
    }
    .srch input::placeholder{color:#94A3B8}
    .srch-btn{
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;border:none;border-radius:10px;padding:11px 22px;
      font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
      transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;
    }
    .srch-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.35)}
    .srch-btn:disabled{opacity:.7;cursor:not-allowed}

    /* ═══ CALENDAR ═══ */
    .cal-wrap{background:var(--white);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}

    .wk-nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:13px 20px;border-bottom:1.5px solid var(--border);
    }
    .wk-btn{
      background:#F1F5F9;border:1px solid var(--border);border-radius:8px;
      padding:7px 13px;font-size:18px;cursor:pointer;color:var(--muted);transition:all .2s;
    }
    .wk-btn:hover{background:#DBEAFE;color:var(--blue)}
    .wk-range{font-size:14px;font-weight:600;color:var(--text)}

    /* Grid header */
    .cal-head{
      display:grid;
      grid-template-columns:52px repeat(6,1fr);
      border-bottom:2px solid var(--border);
    }
    .hd-corner{
      background:#F8FAFC;border-right:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:10px;color:var(--muted);font-weight:600;padding:12px 4px;
    }
    .hd-day{padding:12px 6px;text-align:center;border-right:1px solid var(--border)}
    .hd-day:last-child{border-right:none}
    .hd-day.today{background:linear-gradient(135deg,var(--blue),var(--blue2))}
    .hd-day.today .dn,.hd-day.today .dd{color:white}
    .dn{font-size:13px;font-weight:700;color:var(--text)}
    .dd{font-size:11px;color:var(--muted);margin-top:2px}

    /* Grid body */
    .cal-body{display:grid;grid-template-columns:52px repeat(6,1fr);position:relative}
    .tiet-col{border-right:1px solid var(--border)}
    .tiet-num{
      height:var(--th);display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:600;color:#94A3B8;border-bottom:1px solid #F1F5F9;
    }
    .day-col{position:relative;border-right:1px solid var(--border)}
    .day-col:last-child{border-right:none}
    .day-col-bg{position:absolute;inset:0;pointer-events:none}
    .bg-row{height:var(--th);border-bottom:1px dashed #EDF2FB}

    /* Subject card */
    .sub-card{
      position:absolute;left:3px;right:3px;border-radius:10px;
      padding:7px 9px;cursor:pointer;overflow:hidden;z-index:1;
      transition:transform .15s,box-shadow .15s;
    }
    .sub-card:hover{transform:scale(1.025);z-index:5}
    .sc-tiet{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.85)}
    .sc-name{
      font-size:11.5px;font-weight:700;color:white;margin-top:3px;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .sc-room{font-size:10px;color:rgba(255,255,255,.9);margin-top:3px;display:flex;align-items:center;gap:3px}
    .sc-icon{position:absolute;bottom:6px;right:8px;font-size:18px;opacity:.25}

    /* Empty overlay */
    .empty-overlay{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(255,255,255,.88);pointer-events:none;
      text-align:center;padding:30px;z-index:10;
    }
    .empty-overlay .ei{font-size:52px;margin-bottom:12px}
    .empty-overlay .et{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
    .empty-overlay .es{font-size:13px;color:var(--muted)}

    /* Modal */
    .m-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.4);
      display:flex;align-items:center;justify-content:center;
      z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .m-overlay.open{opacity:1;pointer-events:all}
    .modal{
      background:var(--white);border-radius:20px;padding:26px;
      max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);
      transform:translateY(20px) scale(.97);transition:transform .2s;
    }
    .m-overlay.open .modal{transform:none}
    .m-bar{height:6px;border-radius:6px;margin-bottom:18px}
    .m-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;line-height:1.4}
    .m-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
    .m-ico{font-size:15px;flex-shrink:0;margin-top:1px}
    .m-lbl{font-size:11px;color:var(--muted)}
    .m-val{font-size:13.5px;color:var(--text);font-weight:500;margin-top:1px}
    .m-close{
      margin-top:20px;width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;border:none;border-radius:10px;padding:12px;
      font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    }
    .m-close:hover{opacity:.9}
  </style>
</head>
<body>
<div class="app">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div>
        <h2>UTC2</h2>
        <p>Thời khóa biểu sinh viên</p>
      </div>
    </div>

    <div class="sb-student">
      <div class="sb-avatar">👤</div>
      <div>
        <span class="sb-lbl">Xin chào!</span>
        <span id="sbName">Sinh viên UTC2</span>
      </div>
    </div>

    <div class="sb-day">
      <div class="lbl">Hôm nay là</div>
      <div class="name" id="sbDay">—</div>
      <div class="date" id="sbDate">—</div>
    </div>

    <div class="sb-quote">
      <p id="sbQuote">✨ Học hôm nay, thành công ngày mai!</p>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">

    <div class="page-hdr">
      <h1>🌙 Thời khoá biểu</h1>
      <div class="sub">Học tập hôm nay – Thành công ngày mai ✨</div>
      <div class="sem-badge">📅 HK1 – 2026/2027 ▾</div>
    </div>

    <div class="err-bar" id="errBar"><span>⚠️</span><span id="errTxt"></span></div>

    <div class="res-card" id="resCard">
      <div class="res-avt">🧑‍🎓</div>
      <div>
        <div class="res-name" id="resName">—</div>
        <div class="res-mssv" id="resMssv">—</div>
      </div>
      <div class="res-cnt" id="resCnt">—</div>
    </div>

    <div class="srch">
      <span class="ico">🔍</span>
      <input id="mssvIn" type="text" placeholder="Nhập MSSV của bạn..." maxlength="20" autocomplete="off" />
      <button class="srch-btn" id="srchBtn" onclick="doSearch()">Xem thời khóa biểu ✦</button>
    </div>

    <div class="cal-wrap">
      <div class="wk-nav">
        <button class="wk-btn" onclick="shiftWeek(-1)">←</button>
        <span class="wk-range" id="wkRange">—</span>
        <button class="wk-btn" onclick="shiftWeek(1)">→</button>
      </div>
      <div class="cal-head" id="calHead"></div>
      <div class="cal-body" id="calBody"></div>
    </div>

  </main>
</div>

<!-- ═══ MODAL ═══ -->
<div class="m-overlay" id="mOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="m-bar" id="mBar"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-row"><span class="m-ico">🆔</span><div><div class="m-lbl">Mã học phần</div><div class="m-val" id="mCode"></div></div></div>
    <div class="m-row"><span class="m-ico">👨‍🏫</span><div><div class="m-lbl">Giảng viên</div><div class="m-val" id="mGv"></div></div></div>
    <div class="m-row"><span class="m-ico">🗓️</span><div><div class="m-lbl">Thời gian học</div><div class="m-val" id="mTime"></div></div></div>
    <div class="m-row"><span class="m-ico">📅</span><div><div class="m-lbl">Học kỳ</div><div class="m-val" id="mSem"></div></div></div>
    <div class="m-row"><span class="m-ico">📍</span><div><div class="m-lbl">Phòng học</div><div class="m-val" id="mRoom"></div></div></div>
    <button class="m-close" onclick="closeModal()">Đóng</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let weekStart = monday(new Date());
let subjects  = [];

const DAY_LABELS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const TIET_H    = 54;
const MAX_TIET  = 15;

const COLORS = [
  '#3B82F6','#10B981','#EC4899','#F59E0B','#8B5CF6',
  '#14B8A6','#EF4444','#6366F1','#F97316','#06B6D4',
];
const ICONS = ['💻','⚡','</>','🔬','📐','🧮','📡','🏗️','🔧','🎯','🧪','📚'];
const QUOTES = [
  '"Mỗi ngày học tập là một bước tiến đến thành công! 💙"',
  '"Kiến thức là sức mạnh. Hãy học hết mình hôm nay! 🌟"',
  '"Đừng ngại khó — hãy coi đó là cơ hội phát triển! 🚀"',
  '"Học chăm, chơi đúng lúc — bí quyết của người giỏi! ✨"',
  '"Hôm nay là cơ hội để tốt hơn ngày hôm qua! 💪"',
];

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
(function init() {
  const DOW = ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
  const today = new Date();
  document.getElementById('sbDay').textContent  = DOW[today.getDay()];
  document.getElementById('sbDate').textContent = fmt(today);
  document.getElementById('sbQuote').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  renderHead();
  renderBody([]);

  document.getElementById('mssvIn').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  const hash = location.hash.replace('#','').trim();
  if (hash) {
    document.getElementById('mssvIn').value = hash;
    doSearch();
  }
})();

/* ══════════════════════════════════════════
   DATE HELPERS
══════════════════════════════════════════ */
function monday(d) {
  const c = new Date(d); c.setHours(0,0,0,0);
  const dow = c.getDay() || 7;
  c.setDate(c.getDate() - (dow - 1));
  return c;
}
function add(d, n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function fmt(d){ return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtS(d){ return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }
function pad(n){ return String(n).padStart(2,'0'); }
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }

/* ══════════════════════════════════════════
   WEEK NAVIGATION
══════════════════════════════════════════ */
function shiftWeek(dir){
  weekStart = add(weekStart, dir*7);
  renderHead();
  renderBody(subjects);
}

function renderHead(){
  const end   = add(weekStart, 5);
  const today = new Date(); today.setHours(0,0,0,0);

  document.getElementById('wkRange').textContent =
    `${fmtS(weekStart)} – ${fmtS(end)}/${weekStart.getFullYear()}`;

  const head = document.getElementById('calHead');
  head.innerHTML = '';

  const corner = el('div','hd-corner','Tiết');
  head.appendChild(corner);

  for(let d=0;d<6;d++){
    const date  = add(weekStart,d);
    const isNow = sameDay(date,today);
    const cell  = el('div', `hd-day${isNow?' today':''}`);
    cell.innerHTML = `<div class="dn">${DAY_LABELS[d]}</div><div class="dd">${fmtS(date)}</div>`;
    head.appendChild(cell);
  }
}

/* ══════════════════════════════════════════
   PARSE TKB STRING
══════════════════════════════════════════ */
function parseTkb(tkbStr){
  if(!tkbStr) return [];
  const results = [];
  const re = /(Thứ [2-7]|Chủ nhật): tiết (\d+) -> (\d+)/g;
  let m, hits = [];
  while((m=re.exec(tkbStr))!==null)
    hits.push({idx:m.index, end:m.index+m[0].length, day:m[1], s:+m[2], e:+m[3]});

  hits.forEach((h,i)=>{
    const nxt   = i+1<hits.length ? hits[i+1].idx : tkbStr.length;
    const after = tkbStr.slice(h.end, nxt);
    const rm    = after.match(/^\s*\|\s*(.+?)(?:\s*\|.*)?$/);
    results.push({day:h.day, startTiet:h.s, endTiet:h.e, room: rm ? rm[1].trim() : ''});
  });
  return results;
}

function dayIdx(label){ return DAY_LABELS.indexOf(label); }

/* ══════════════════════════════════════════
   RENDER CALENDAR BODY
══════════════════════════════════════════ */
function renderBody(subs){
  const body = document.getElementById('calBody');
  body.innerHTML = '';

  const colorOf = {}, iconOf = {};
  subs.forEach((s,i)=>{
    const k = s.MA_LOP||s.TEN_MON;
    colorOf[k] = COLORS[i%COLORS.length];
    iconOf[k]  = ICONS [i%ICONS.length];
  });

  const tc = el('div','tiet-col');
  for(let t=1;t<=MAX_TIET;t++) tc.appendChild(el('div','tiet-num',String(t)));
  body.appendChild(tc);

  for(let d=0;d<6;d++){
    const dc = el('div','day-col');
    dc.style.height = `${MAX_TIET*TIET_H}px`;

    const bg = el('div','day-col-bg');
    for(let t=0;t<MAX_TIET;t++) bg.appendChild(el('div','bg-row'));
    dc.appendChild(bg);

    subs.forEach(sub=>{
      const k     = sub.MA_LOP||sub.TEN_MON;
      const color = colorOf[k]||COLORS[0];
      const icon  = iconOf[k] ||'📚';
      const scheds = parseTkb(sub.TKB||sub.LICH_HOC||'');

      scheds.forEach(sc=>{
        if(dayIdx(sc.day)!==d) return;
        if(sc.startTiet<1||sc.endTiet>MAX_TIET) return;

        const top = (sc.startTiet-1)*TIET_H + 2;
        const h   = (sc.endTiet-sc.startTiet+1)*TIET_H - 4;

        const shortName = (sub.TEN_MON||sub.MA_LOP||'')
          .replace(/(-\d+-\d+.*)$/,'').trim();
        const roomShort = sc.room ? sc.room.split(' ')[0] : '';

        const card = el('div','sub-card');
        card.style.cssText = `top:${top}px;height:${h}px;background:${color};box-shadow:0 2px 8px ${color}55;`;
        card.innerHTML = `
          <div class="sc-tiet">Tiết ${sc.startTiet}–${sc.endTiet}</div>
          <div class="sc-name">${shortName||sub.MA_LOP||'?'}</div>
          ${roomShort?`<div class="sc-room">📍 ${roomShort}</div>`:''}
          <div class="sc-icon">${icon}</div>
        `;
        card.addEventListener('click',()=>openModal(sub,sc,color));
        dc.appendChild(card);
      });
    });

    body.appendChild(dc);
  }

  if(subs.length===0){
    const ov = el('div','empty-overlay');
    ov.innerHTML = `
      <div class="ei">📅</div>
      <div class="et">Nhập MSSV để xem thời khoá biểu</div>
      <div class="es">Dùng ô tìm kiếm phía trên rồi bấm <strong>Xem thời khóa biểu</strong></div>
    `;
    body.appendChild(ov);
  }
}

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
async function doSearch(){
  const mssv = document.getElementById('mssvIn').value.trim().toUpperCase();
  if(!mssv){ showErr('Vui lòng nhập Mã số sinh viên!'); return; }

  hideErr();
  setLoading(true);
  document.getElementById('resCard').classList.remove('show');
  location.hash = mssv;

  try{
    const res  = await fetch(`/api/tkb/${encodeURIComponent(mssv)}`);
    const json = await res.json();

    if(!json.ok) throw new Error(json.error||'API lỗi');

    if(!json.data?.length){
      showErr(`Không tìm thấy TKB cho MSSV: ${mssv}. Hãy kiểm tra lại!`);
      subjects = [];
      renderBody([]);
      return;
    }

    subjects = json.data;
    const name = json.data[0]?.HO_TEN||'Sinh viên UTC2';

    document.getElementById('sbName').textContent   = name;
    document.getElementById('resName').textContent  = name;
    document.getElementById('resMssv').textContent  = `MSSV: ${mssv}`;
    document.getElementById('resCnt').textContent   = `${json.data.length} môn học`;
    document.getElementById('resCard').classList.add('show');

    renderBody(subjects);

  }catch(err){
    showErr('Lỗi kết nối: '+err.message);
    subjects=[];
    renderBody([]);
  }finally{
    setLoading(false);
  }
}

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
function openModal(sub, sc, color){
  document.getElementById('mBar').style.background  = color;
  document.getElementById('mTitle').textContent     = sub.TEN_MON||sub.MA_LOP;
  document.getElementById('mCode').textContent      = sub.MA_LOP||'—';
  document.getElementById('mGv').textContent        = sub.GIANG_VIEN||'—';
  document.getElementById('mTime').textContent      =
    `${sc.day}: Tiết ${sc.startTiet} → ${sc.endTiet}${sc.room?' | '+sc.room:''}`;
  document.getElementById('mSem').textContent       =
    `${sub.NGAY_BD_TG||'?'} → ${sub.NGAY_KT_TG||'?'}`;
  document.getElementById('mRoom').textContent      = sc.room||'—';
  document.getElementById('mOverlay').classList.add('open');
}

function closeModal(e){
  if(!e||e.target===document.getElementById('mOverlay'))
    document.getElementById('mOverlay').classList.remove('open');
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function el(tag,cls='',txt=''){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(txt) e.textContent=txt;
  return e;
}
function showErr(msg){
  document.getElementById('errTxt').textContent=msg;
  document.getElementById('errBar').classList.add('show');
}
function hideErr(){ document.getElementById('errBar').classList.remove('show'); }
function setLoading(on){
  const b=document.getElementById('srchBtn');
  b.disabled=on;
  b.textContent=on?'⏳ Đang tải...':'Xem thời khóa biểu ✦';
}
</script>
